# Reference copy. The active workflow is .github/workflows/main.yml. Do not add a second schedule.
name: Opportunity Hunter Bot

on:
  schedule:
    # 01:07 UTC = 08:07 Asia/Jakarta.
    - cron: '7 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Start with verify after installing Apps Script v2
        required: true
        default: verify
        type: choice
        options: [verify, test, dry-run, full, bootstrap]

permissions:
  contents: read
concurrency:
  group: opportunity-hunter
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check offline rules
        run: python -m unittest discover -s tests -v
      - name: Run bot
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          APPS_SCRIPT_WEBHOOK_SECRET: ${{ secrets.APPS_SCRIPT_WEBHOOK_SECRET }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          USER_TIMEZONE: Asia/Jakarta
          RUN_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
        run: python main.py
      - name: Save run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-hunter-run-report
          path: run-report.json
          if-no-files-found: ignore
          retention-days: 7
